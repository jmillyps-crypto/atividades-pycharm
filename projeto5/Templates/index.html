<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Conversor de Temperatura</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="container">
    <form action="/converter_terperatura" method="post">

        <h1>Converter Temperatura</h1>

        <label>Digite o valor em celcius</label>
        <input type="number" id="celcius" name="celcius" step="0.01" required>


        <button type="submit">Calcular Temperatura</button>

    </form>

    {% if celcius%}
    <div class="resultado">
        <h2>Resultado da Conversão</h2>
        <p><strong>A temperatura é:</strong> {{ fahrenheit }} fahrenheit</p>

    </div>
    {%endif%}

</div>

</body>
</html>
